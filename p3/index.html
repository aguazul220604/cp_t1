<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión y Automatización de Eliminación de Bundles Dataiku</title>
    <!-- Hojas de estilo -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- ==========================================
         1. HEADER TRANSVERSAL
         ========================================== -->
    <header class="global-header">
      <div class="brand-container">
        <!-- Logo Icono -->
        <svg class="brand-logo" viewBox="0 0 24 24" fill="#00A896">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"
          />
        </svg>
        <div class="brand-titles">
          <h1>Gestión y Automatización de Eliminación</h1>
          <h2>Bundles Dataiku en S3</h2>
        </div>
      </div>

      <!-- Enrutador Principal de Flujos -->
      <div class="flow-select-container">
        <select id="select-flow-dropdown">
          <option value="HOME" selected>Seleccionar flujo</option>
          <option value="NEW">NEW FLOW</option>
          <option value="LEGACY">LEGACY FLOW</option>
        </select>
      </div>
    </header>

    <!-- ==========================================
         2. CONTENEDOR DINÁMICO DE VISTAS (JS RENDER)
         ========================================== -->
    <main id="main-content-container">
      <!-- El contenido de las 6 vistas se renderiza dinámicamente desde app.js -->
    </main>

    <!-- ==========================================
         3. DASHBOARD INFERIOR (FOOTER STICKY)
         ========================================== -->
    <footer class="footer-dashboard">
      <!-- Indicadores y Métricas Dinámicas -->
      <div class="metrics-summary">
        <p>
          Espacio total ocupado de versionamientos:
          <strong id="stat-total">0.00 MB</strong>
        </p>
        <p>
          Espacio por liberar de versionamientos:
          <strong id="stat-liberar">0.00 MB</strong>
        </p>
        <p>
          Espacio resultante considerado de versionamientos:
          <strong id="stat-resultante">0.00 MB</strong>
        </p>
        <p id="stat-periodo">Periodo de ejecución: Sep 2026</p>
        <p id="stat-criterio">Antigüedad de versionamientos: > 6 meses</p>
      </div>

      <!-- Botones de Acción Globales -->
      <div class="footer-actions">
        <button
          class="btn-action-global orange"
          onclick="triggerGlobalReport()"
        >
          Consulta Global
        </button>
        <button class="btn-action-global yellow" onclick="triggerAuthorize()">
          Autorizar
        </button>
      </div>
    </footer>

    <!-- Dependencias y Lógica Backend / Frontend -->
    <script src="/resource/dataiku.js"></script>
    <script src="app.js"></script>
  </body>
</html>
