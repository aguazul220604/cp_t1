<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Limpieza de Bundles de Dataiku en S3</title>
    <!-- Estilos de Dataiku WebApp y personalizados -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- CONTENEDOR PRINCIPAL -->
    <div class="app-container">
      <!-- ENCABEZADO INSTITUCIONAL -->
      <header class="app-header">
        <div class="header-branding">
          <div class="logo-container">
            <span class="logo-icon"></span>
          </div>
          <div class="header-titles">
            <span class="org-subtitle"
              >Banamex | Cognitive Services and Machine Learning Core of
              Excellence</span
            >
            <h1 class="main-title">
              Gestión de Limpieza de Bundles de Dataiku en S3
            </h1>
          </div>
        </div>

        <!-- Botón Global para cambiar de Flujo (NEW FLOW / LEGACY FLOW) -->
        <div class="header-actions">
          <button id="btn-select-flow" class="btn-primary-action">
            Seleccionar flujo
          </button>
        </div>
      </header>

      <!-- BARRA DE SUB-NAVEGACIÓN Y TÍTULO DE VISTA -->
      <nav class="sub-header">
        <div class="view-indicator">
          <h2 id="view-title">
            NEW FLOW | Versionamiento de Proyectos por Ambiente
          </h2>
        </div>
        <div class="sub-header-actions">
          <!-- Botón dinámico que se oculta o muestra dependiendo de la vista -->
          <button id="btn-toggle-historic" class="btn-secondary-action">
            Consultar histórico
          </button>
        </div>
      </nav>

      <!-- CONTENEDOR DINÁMICO (JavaScript renderiza Vistas 1, 2, 3 o 4 aquí) -->
      <main id="view-container" class="main-content">
        <!-- Renderizado por app.js -->
      </main>

      <!-- PIE DE PÁGINA FIXO: MÉTRICAS DE ALMACENAMIENTO Y AUTORIZACIÓN -->
      <footer class="app-footer">
        <div class="metrics-panel">
          <div class="metric-item">
            <span class="metric-label">Espacio total ocupado:</span>
            <span id="stat-total" class="metric-value">0.00 GB</span>
          </div>
          <div class="metric-item">
            <span class="metric-label">Espacio por liberar:</span>
            <span id="stat-liberate" class="metric-value highlight-red"
              >0.00 GB</span
            >
          </div>
          <div class="metric-item">
            <span class="metric-label">Espacio resultante considerado:</span>
            <span id="stat-result" class="metric-value highlight-green"
              >0.00 GB</span
            >
          </div>
        </div>

        <!-- Botón Principal de Ejecución y Descarga de CSV -->
        <div class="action-panel">
          <button id="btn-authorize" class="btn-authorize">Autorizar</button>
        </div>
      </footer>
    </div>

    <!-- Carga de librerías de Dataiku y Script de la WebApp -->
    <script src="/static/dataiku/js/api/v1/dataiku.js"></script>
    <script src="app.js"></script>
  </body>
</html>
