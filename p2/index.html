<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Detector PII - Banamex</title>
  </head>
  <body>
    <!-- Pantalla de Carga -->
    <div id="loadingSpinner" class="loading-overlay">
      <div class="spinner"></div>
      <p style="margin-top: 15px; color: #555; font-weight: bold">
        Analizando datos con el modelo LightGBM...
      </p>
    </div>

    <!-- Encabezado -->
    <header class="header-banamex">
      <h2>Detección e Identificación de Datos PII</h2>
      <span class="badge-tag">Banamex Data Governance</span>
    </header>

    <div class="container">
      <!-- Sección 1: Carga de Archivo -->
      <section class="card">
        <h3 class="card-title">1. Cargar Dataset o Tabla</h3>
        <div class="upload-box">
          <input type="file" id="datasetFile" accept=".csv, .xlsx" />
          <button id="btnProcess" class="btn-banamex">Analizar PII</button>
        </div>
      </section>

      <!-- Sección 2: Listado de Columnas PII -->
      <section id="piiSummarySection" class="card" style="display: none">
        <h3 class="card-title danger">
          2. Columnas PII Detectadas y Porcentajes
        </h3>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Nombre de Columna</th>
                <th>Descripción</th>
                <th>Probabilidad PII (%)</th>
                <th>Estado Predicción</th>
              </tr>
            </thead>
            <tbody id="piiListBody">
              <!-- Filas dinámicas -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Sección 3: Vista Previa con Columnas PII en Rojo -->
      <section id="tablePreviewSection" class="card" style="display: none">
        <h3 class="card-title">3. Vista Previa (Columnas PII en Rojo)</h3>
        <div class="table-responsive">
          <table>
            <thead id="previewThead">
              <!-- Cabeceras dinámicas -->
            </thead>
            <tbody id="previewTbody">
              <!-- Celdas dinámicas -->
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- Script de Interacción Nativa (JavaScript Vainilla) -->
    <script>
      document
        .getElementById("btnProcess")
        .addEventListener("click", function () {
          const fileInput = document.getElementById("datasetFile");
          const file = fileInput.files[0];

          if (!file) {
            alert("Por favor, selecciona un archivo CSV o Excel.");
            return;
          }

          const formData = new FormData();
          formData.append("file", file);

          // Mostrar pantalla de carga
          document.getElementById("loadingSpinner").style.display = "flex";

          // Petición AJAX al Backend de Dataiku
          fetch(getWebAppBackendUrl("process_table"), {
            method: "POST",
            body: formData,
          })
            .then((response) => {
              if (!response.ok)
                throw new Error("Error en el backend al procesar la tabla.");
              return response.json();
            })
            .then((data) => {
              document.getElementById("loadingSpinner").style.display = "none";

              renderSummary(data.columns_analysis);
              renderPreview(data.columns_analysis, data.sample_rows);

              document.getElementById("piiSummarySection").style.display =
                "block";
              document.getElementById("tablePreviewSection").style.display =
                "block";
            })
            .catch((error) => {
              document.getElementById("loadingSpinner").style.display = "none";
              alert("Error: " + error.message);
            });
        });

      // Generar tabla de resumen PII
      function renderSummary(columns) {
        const tbody = document.getElementById("piiListBody");
        tbody.innerHTML = "";

        columns.forEach((col) => {
          const probPct = (col.pii_probability * 100).toFixed(2);
          const isPii = col.is_pii;

          const tr = document.createElement("tr");
          tr.innerHTML = `
                    <td><strong>${col.name}</strong></td>
                    <td style="color: #666;">${col.description || "Sin descripción"}</td>
                    <td>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill ${isPii ? "high" : ""}" style="width: ${probPct}%;">
                                ${probPct}%
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="status-badge ${isPii ? "danger" : "success"}">
                            ${isPii ? "POTENCIAL PII" : "NO PII"}
                        </span>
                    </td>
                `;
          tbody.appendChild(tr);
        });
      }

      // Generar vista previa con celdas/encabezados en rojo
      function renderPreview(columns, rows) {
        const thead = document.getElementById("previewThead");
        const tbody = document.getElementById("previewTbody");

        thead.innerHTML = "";
        tbody.innerHTML = "";

        const piiCols = new Set(
          columns.filter((c) => c.is_pii).map((c) => c.name),
        );

        // Encabezados
        let headerTr = document.createElement("tr");
        columns.forEach((col) => {
          const th = document.createElement("th");
          th.textContent = col.name;
          if (piiCols.has(col.name)) {
            th.classList.add("pii-header");
          }
          headerTr.appendChild(th);
        });
        thead.appendChild(headerTr);

        // Celdas
        rows.forEach((row) => {
          let tr = document.createElement("tr");
          columns.forEach((col) => {
            const td = document.createElement("td");
            td.textContent = row[col.name] !== undefined ? row[col.name] : "";
            if (piiCols.has(col.name)) {
              td.classList.add("pii-cell");
            }
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      }
    </script>
  </body>
</html>
